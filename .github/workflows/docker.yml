# Builds multi-platform Docker images for logdive and pushes them to GHCR.
#
# Trigger matrix:
#   push → main                  build + push  tags: main, sha-<short>
#   push → release/v*            build + push  tags: <branch>, sha-<short>
#   push → tag v*                build + push  tags: <semver>, <major>.<minor>,
#                                                    latest, sha-<short>
#   pull_request → main          build only    (no push, no cache write)
#   pull_request → release/v*    build only    (no push, no cache write)
#
# Cache strategy:
#   PR builds    — read from GHA cache, never write (avoids transient 502s
#                  on cache export that would fail CI for no build reason)
#   Push builds  — read + write GHA cache with mode=min (final-image layers
#                  only; mode=max causes large exports that hit 502 on write)
#
# Platforms: linux/amd64 + linux/arm64 (QEMU emulation for cross-arch).
# Registry:  ghcr.io/aryagorjipour/logdive (GITHUB_TOKEN — no PAT needed).

name: Docker

on:
  push:
    branches:
      - main
      - "release/v*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - "release/v*"

# Minimal permissions: read repo contents, write packages (GHCR push).
permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # QEMU provides user-space emulation for arm64 on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # BuildKit builder with the docker-container driver, required for
      # multi-platform builds and GHA cache export/import.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate with GHCR using the workflow's built-in GITHUB_TOKEN.
      # Skipped for pull_request events (nothing is pushed from PRs).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate image tags and OCI labels from the Git ref.
      # Tags produced per event type:
      #   tag v0.2.0  → 0.2.0 | 0.2 | latest | sha-<short>
      #   branch main → main  | sha-<short>
      #   branch release/v*   → release-v* | sha-<short>  (/ → - sanitised)
      #   PR          → pr-<number> (no push)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aryagorjipour/logdive
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=logdive
            org.opencontainers.image.description=Fast self-hosted log query engine for structured JSON logs
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.source=https://github.com/Aryagorjipour/logdive

      # PR builds: read from cache only — never write.
      # Writing cache on PRs caused transient 502s on the GHA cache backend
      # during layer blob export, failing CI for no build-related reason.
      - name: Build (PR — no push, no cache write)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # Push builds: read + write cache with mode=min (final-image layers
      # only). mode=max exports all intermediate layers — a much larger
      # artifact that reliably hit 502s during export on the GHA backend.
      - name: Build and push (branch/tag)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min